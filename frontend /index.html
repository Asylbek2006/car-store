<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car System - Login</title>
    <link rel="stylesheet" href="./css/style.css">
    <style>
        .text-right { text-align: right; }
        .mb-1 { margin-bottom: 0.5rem; }
        .auth-card { min-height: 400px; }
        .hidden { display: none !important; }
    </style>
</head>
<body class="bg-gray">
    <div class="auth-wrapper">
        <div class="auth-card">
            <h1 class="text-center">Car Manager</h1>
            <div id="alert-box" class="alert hidden"></div>

            <form id="login-form">
                <h2>Sign In</h2>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="login-email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="login-password" required>
                </div>
                
                <div class="text-right mb-1">
                    <a href="#" id="show-forgot" style="font-size: 0.9rem; color: #666;">Forgot Password?</a>
                </div>

                <button type="submit" class="btn btn-primary full-width">Login</button>
                <p class="mt-2 text-center">
                    No account? <a href="#" id="show-register">Register</a>
                </p>
            </form>

            <form id="register-form" class="hidden">
                <h2>Create Account</h2>
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="reg-name" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="reg-email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="reg-password" required>
                </div>
                <button type="submit" class="btn btn-secondary full-width">Sign Up</button>
                <p class="mt-2 text-center">
                    Have an account? <a href="#" id="show-login">Login</a>
                </p>
            </form>

            <form id="forgot-form" class="hidden">
                <h2>Reset Password</h2>
                <p style="font-size: 0.9rem; color: #666; margin-bottom: 15px;">
                    Enter your email address and we'll send you a link to reset your password.
                </p>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="forgot-email" required>
                </div>
                <button type="submit" class="btn btn-primary full-width">Send Reset Link</button>
                <p class="mt-2 text-center">
                    Remembered it? <a href="#" id="back-to-login">Back to Login</a>
                </p>
            </form>
        </div>
    </div>

    <script src="./js/api.js"></script>
    <script src="./js/auth.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            const forgotForm = document.getElementById('forgot-form');

            // --- UI SWITCHING LOGIC ---

            // Show Register
            document.getElementById('show-register').addEventListener('click', (e) => {
                e.preventDefault();
                loginForm.classList.add('hidden');
                forgotForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
            });

            // Show Login (from Register)
            document.getElementById('show-login').addEventListener('click', (e) => {
                e.preventDefault();
                registerForm.classList.add('hidden');
                forgotForm.classList.add('hidden');
                loginForm.classList.remove('hidden');
            });

            // Show Forgot Password
            document.getElementById('show-forgot').addEventListener('click', (e) => {
                e.preventDefault();
                loginForm.classList.add('hidden');
                registerForm.classList.add('hidden');
                forgotForm.classList.remove('hidden');
            });

            // Back to Login (from Forgot)
            document.getElementById('back-to-login').addEventListener('click', (e) => {
                e.preventDefault();
                forgotForm.classList.add('hidden');
                registerForm.classList.add('hidden');
                loginForm.classList.remove('hidden');
            });

            // --- FORGOT PASSWORD SUBMISSION ---
            forgotForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                // 1. Get Email
                const emailInput = document.getElementById('forgot-email');
                const email = emailInput ? emailInput.value : null;

                if (!email) {
                    alert("Please enter your email address.");
                    return;
                }

                // 2. UI Feedback
                const submitButton = forgotForm.querySelector('button');
                const originalText = submitButton.innerText;
                submitButton.innerText = "Sending...";
                submitButton.disabled = true;

                try {
                    // 3. SEND REQUEST (Fixed URL here: /api/user/...)
                    const response = await fetch('http://localhost:8000/api/user/forgot-password', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: email })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        // Success
                        alert("Success! " + data.message);
                        
                        // Switch back to Login
                        forgotForm.reset();
                        forgotForm.classList.add('hidden');
                        loginForm.classList.remove('hidden');
                    } else {
                        // Error from server
                        alert("Error: " + (data.error || "Unknown error"));
                    }
                } catch (err) {
                    console.error("Network Error:", err);
                    alert("Could not connect to the server. Make sure 'go run main.go' is running!");
                } finally {
                    // Restore Button
                    submitButton.innerText = originalText;
                    submitButton.disabled = false;
                }
            });
        });
    </script>
</body>
</html>
